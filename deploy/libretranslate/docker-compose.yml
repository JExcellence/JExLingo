# LibreTranslate for JExLingo - self-hosted, offline after the first model download.
# Start:   docker compose up -d
# Logs:    docker compose logs -f
# API key: docker exec jexlingo-libretranslate ltmanage keys add 600
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: jexlingo-libretranslate
    restart: unless-stopped
    # --load-only is passed as an argument on purpose: LT_LOAD_ONLY as an environment variable is not split on
    # commas by LibreTranslate. Add a language here and in the plugin's languages.enabled, then restart.
    command: ["--load-only", "en,de", "--char-limit", "500", "--req-limit", "600", "--api-keys"]
    ports:
      # Same machine as the Minecraft server: reachable only locally. Never expose port 5000 to the internet.
      - "127.0.0.1:5000:5000"
    volumes:
      - lt-models:/home/libretranslate/.local
      - lt-db:/app/db
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  lt-models:
  lt-db:
