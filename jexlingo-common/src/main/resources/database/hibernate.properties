# ============================================
# JExLingo database
# ============================================
# H2    embedded file next to the plugin, no setup needed (default)
# MYSQL a MySQL or MariaDB server; the bundled MySQL driver talks to both
#
# Only these two drivers are downloaded at start. JExLingo stores settings, glossary, corrections, pinned phrases
# and daily totals; it never stores chat lines.
database.type=H2

# ============================================
# H2 (embedded, default)
# ============================================
h2.url=jdbc:h2:file:./plugins/JExLingo/database/jexlingo;MODE=MySQL;AUTO_SERVER=TRUE
h2.driver=org.h2.Driver
h2.dialect=org.hibernate.dialect.H2Dialect
h2.username=sa
h2.password=

# ============================================
# MySQL or MariaDB
# ============================================
# Create the database first: CREATE DATABASE jexlingo CHARACTER SET utf8mb4;
# Tables are created on the first start.
mysql.url=jdbc:mysql://localhost:3306/jexlingo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.dialect=org.hibernate.dialect.MySQLDialect
mysql.username=jexlingo
mysql.password=change_me

# ============================================
# Connection pool
# ============================================
# JExLingo writes in small batches from one worker pool; a few connections are enough.
jehibernate.pool.maximumPoolSize=6
jehibernate.pool.minimumIdle=1
jehibernate.pool.connectionTimeout=10000
jehibernate.pool.leakDetectionThreshold=30000

# ============================================
# Hibernate
# ============================================
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.highlight_sql=false
hibernate.use_sql_comments=false
hibernate.jdbc.batch_size=25
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.generate_statistics=false
