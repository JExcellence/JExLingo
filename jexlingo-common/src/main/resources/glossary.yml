# JExLingo default glossary
# Read once, when the glossary is still empty. To add new terms from this file later, run
#   /lingo glossary import       (adds what is new, keeps existing terms)
# or manage it in game:
#   /lingo glossary add keep <term>
#   /lingo glossary add force <term> <translation>
#   /lingo glossary add force de>en:<term> <translation>   (only for one language pair)
#   /lingo glossary remove <term>

# Terms that are never translated. Add your server name, game modes and ranks here.
keep:
  # Chat slang
  - gg
  - afk
  - brb
  - lol
  - xp
  - pvp
  - pve
  # Game words a translator tends to change (Spawn -> "Laichen", Creeper -> "Kriecher")
  - Spawn
  - Nether
  - Creeper
  - Enderman
  - Elytra
  - Redstone

# Terms that always get the same translation. source/target are optional (empty = every language pair).
# Example for a skyblock server:
#   - { term: Insel, replacement: island, source: de, target: en }
force: []
