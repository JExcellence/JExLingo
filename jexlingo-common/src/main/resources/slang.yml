# JExLingo chat abbreviations
# Expanded before a line is sent to the translator, because translation models are trained on written text.
# Players never see the expansion; they see the translation of the full words.
# One section per source language. Whole words only, any case. Glossary keep terms (gg, afk) win over this list.
# Changes apply with /lingo reload.

en:
  u: "you"
  ur: "your"
  r: "are"
  pls: "please"
  plz: "please"
  thx: "thanks"
  ty: "thank you"
  idk: "I don't know"
  imo: "in my opinion"
  btw: "by the way"
  tbh: "to be honest"
  rn: "right now"
  nvm: "never mind"
  ofc: "of course"
  np: "no problem"
  wdym: "what do you mean"
  dm: "private message"
  ppl: "people"
  sry: "sorry"
  cya: "see you"
  gl: "good luck"
  wb: "welcome back"
  w8: "wait"
  bc: "because"
  cuz: "because"
  wanna: "want to"
  gonna: "going to"

