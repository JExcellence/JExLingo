  vllt: "vielleicht"
  iwie: "irgendwie"
  iwas: "irgendwas"
  kp: "keine Ahnung"
  nd: "und"
  jz: "jetzt"
  grad: "gerade"
  bzw: "beziehungsweise"
  zb: "zum Beispiel"
  usw: "und so weiter"
  dnk: "danke"
  sry: "Entschuldigung"
  gn: "gute Nacht"
  hdl: "hab dich lieb"
  wb: "willkommen zurück"
  mom: "Moment"
