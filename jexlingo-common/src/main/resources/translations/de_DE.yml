    same_language: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Diese Nachricht ist schon in deiner Sprache.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Der Übersetzer ist gerade nicht erreichbar. Versuch es gleich noch einmal.</#F1F5F9>'
  erase:
    done: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Übersetzungseinstellungen von</#F1F5F9> <#A78BFA>{name}</#A78BFA> <#F1F5F9>und</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>offene Vorschläge gelöscht.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Löschen fehlgeschlagen. Details stehen im Server-Log.</#F1F5F9>'
  onboarding:
    message: '<#F1F5F9>Der Chat wird für dich übersetzt nach</#F1F5F9> <#A78BFA>{language}</#A78BFA><#F1F5F9>. Fahre über eine markierte Zeile, um das Original zu sehen.</#F1F5F9> <#94A3B8>Einstellungen: /lingo</#94A3B8>'
  help:
