    unknown_toggle: '<#F87171>[X]</#F87171> <#F1F5F9>Nutze</#F1F5F9> <#A78BFA>enable</#A78BFA> <#F1F5F9>oder</#F1F5F9> <#A78BFA>disable</#A78BFA><#F1F5F9>.</#F1F5F9>'
