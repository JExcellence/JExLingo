# JExLingo - Deutsche Übersetzungen
#
# Farbsprache (wie im Rest der Suite):
#   Namen #F1F5F9 | Abschnittstitel #C4B5FD | gedämpfter Text #94A3B8 | Akzent #5EEAD4
#   OK #4ADE80 | Fehler #F87171 | Warnung #FBBF24 | Titel <gradient:#5EEAD4:#38BDF8>
# Status-Marker im Chat: [OK] erledigt, [!] blockiert oder fehlt, [X] fehlgeschlagen.
# Spielertext (Chatzeilen, Vorschläge, Glossarbegriffe) setzt das Plugin als reinen Text ein, er wird nie geparst.

prefix: '<gradient:#5EEAD4:#38BDF8>Lingo</gradient> <dark_gray>»</dark_gray> '

_defaults:
  title: '<#F1F5F9>Menü</#F1F5F9>'
  back: '<#F1F5F9>Zurück</#F1F5F9>'

jexcommand:
  error:
    no-permission: '<#F87171>[X]</#F87171> <#F1F5F9>Dir fehlt die Berechtigung</#F1F5F9> <#5EEAD4>{permission}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    player-only: '<#F87171>[X]</#F87171> <#F1F5F9>Nur Spieler können diesen Befehl nutzen.</#F1F5F9>'
    console-only: '<#F87171>[X]</#F87171> <#F1F5F9>Nur die Konsole kann diesen Befehl nutzen.</#F1F5F9>'
    invalid-argument: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist für</#F1F5F9> <#5EEAD4>{name}</#5EEAD4> <#F1F5F9>nicht gültig.</#F1F5F9>'
    missing-argument: '<#F87171>[X]</#F87171> <#F1F5F9>Es fehlt</#F1F5F9> <#5EEAD4>{name}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    too-many-arguments: '<#F87171>[X]</#F87171> <#F1F5F9>Zu viele Angaben,</#F1F5F9> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>war nicht erwartet.</#F1F5F9>'
    invalid-long: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist keine ganze Zahl.</#F1F5F9>'
    invalid-double: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist keine Zahl.</#F1F5F9>'
    invalid-boolean: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist weder true noch false.</#F1F5F9>'
    not-positive-long: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>muss größer als 0 sein.</#F1F5F9>'
    not-positive-double: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>muss größer als 0 sein.</#F1F5F9>'
    invalid-uuid: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist keine gültige UUID.</#F1F5F9>'
    invalid-enum: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist keins von</#F1F5F9> <#94A3B8>{options}</#94A3B8><#F1F5F9>.</#F1F5F9>'
    expected-single-word: '<#F87171>[X]</#F87171> <#F1F5F9>Ein Wort erwartet, bekommen:</#F1F5F9> <#5EEAD4>{value}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    player-not-online: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist nicht online.</#F1F5F9>'
    player-unknown: '<#F87171>[X]</#F87171> <#F1F5F9>Kein Spieler namens</#F1F5F9> <#5EEAD4>{value}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    internal: '<#F87171>[X]</#F87171> <#F1F5F9>Etwas ist schiefgelaufen:</#F1F5F9> <#94A3B8>{message}</#94A3B8>'
    unknown-subcommand: '<#F87171>[X]</#F87171> <#F1F5F9>Unbekannter Befehl</#F1F5F9> <#5EEAD4>{name}</#5EEAD4><#F1F5F9>. Versuche /lingo help.</#F1F5F9>'
    ambiguous-subcommand: '<#FBBF24>[!]</#FBBF24> <#5EEAD4>{name}</#5EEAD4> <#F1F5F9>passt zu mehreren Unterbefehlen:</#F1F5F9> <#5EEAD4>{choices}</#5EEAD4><#F1F5F9>. Tippe weiter.</#F1F5F9>'
    unknown-type: '<#F87171>[X]</#F87171> <#F1F5F9>Unbekannter Argumenttyp</#F1F5F9> <#5EEAD4>{type}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
  usage: '<#5EEAD4>▸</#5EEAD4> <#F1F5F9>Nutze</#F1F5F9> <#5EEAD4>{usage}</#5EEAD4>'

lingo:
  language:
    de: 'Deutsch'
    en: 'Englisch'
    es: 'Spanisch'
    fr: 'Französisch'
    it: 'Italienisch'
    nl: 'Niederländisch'
    pl: 'Polnisch'
    pt: 'Portugiesisch'
    ru: 'Russisch'
    tr: 'Türkisch'
    cs: 'Tschechisch'
    uk: 'Ukrainisch'
  chat:
    marker: '<dark_gray>[</dark_gray><#5EEAD4>{from} » {to}</#5EEAD4><dark_gray>]</dark_gray>'
    hover:
      original: '<#C4B5FD>Original ({from})</#C4B5FD><newline><#F1F5F9>{original}</#F1F5F9>'
      suggest: '<#5EEAD4>▸</#5EEAD4> <#94A3B8>Klicke, um eine bessere Übersetzung vorzuschlagen</#94A3B8>'
    original_line: '<dark_gray>| {from}:</dark_gray> <#94A3B8>{original}</#94A3B8>'
    translate_button: '<dark_gray>[</dark_gray><#5EEAD4>Ü</#5EEAD4><dark_gray>]</dark_gray>'
    translate_hover: '<#5EEAD4>▸</#5EEAD4> <#94A3B8>Klicke, um diese Zeile zu übersetzen</#94A3B8>'
    follow_up: '<dark_gray>[</dark_gray><#5EEAD4>{from} » {to}</#5EEAD4><dark_gray>]</dark_gray> <#F1F5F9>{name}</#F1F5F9><dark_gray>:</dark_gray> <#F1F5F9>{text}</#F1F5F9>'
  learn:
    hint: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Du schreibst anscheinend auf</#F1F5F9> <#5EEAD4>{language}</#5EEAD4><#F1F5F9>. Klicke hier, um das einzustellen, damit deine Nachrichten richtig übersetzt werden.</#F1F5F9>'
    hover: '<#5EEAD4>▸</#5EEAD4> <#94A3B8>{language} als Schreibsprache einstellen</#94A3B8>'
  show:
    unknown_message: '<#F87171>[X]</#F87171> <#F1F5F9>Diese Nachricht ist älter als fünf Minuten.</#F1F5F9>'
    same_language: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Diese Nachricht ist schon in deiner Sprache.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Der Übersetzer ist gerade nicht erreichbar. Versuch es gleich noch einmal.</#F1F5F9>'
  erase:
    done: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Übersetzungseinstellungen von</#F1F5F9> <#5EEAD4>{name}</#5EEAD4> <#F1F5F9>und</#F1F5F9> <#5EEAD4>{count}</#5EEAD4> <#F1F5F9>offene Vorschläge gelöscht.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Löschen fehlgeschlagen. Details stehen im Server-Log.</#F1F5F9>'
  onboarding:
    message: '<#F1F5F9>Der Chat wird für dich übersetzt nach</#F1F5F9> <#5EEAD4>{language}</#5EEAD4><#F1F5F9>. Fahre über eine markierte Zeile, um das Original zu sehen.</#F1F5F9> <#94A3B8>Einstellungen: /lingo</#94A3B8>'
  help:
    - '<gradient:#5EEAD4:#38BDF8>Lingo</gradient> <dark_gray>|</dark_gray> <#94A3B8>Chat-Übersetzung</#94A3B8>'
    - '<#5EEAD4>/lingo</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>deine Einstellungen öffnen</#94A3B8>'
    - '<#5EEAD4>/lingo lang [auto|code]</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>die Sprache wählen, in der du liest</#94A3B8>'
    - '<#5EEAD4>/lingo write [auto|code]</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>die Sprache wählen, in der du schreibst</#94A3B8>'
    - '<#5EEAD4>/lingo incoming [auto|click|off]</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>automatisch, per Klick oder gar nicht übersetzen</#94A3B8>'
    - '<#5EEAD4>/lingo outgoing [enable|disable]</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>deine Nachrichten übersetzen lassen</#94A3B8>'
    - '<#5EEAD4>/lingo original [enable|disable]</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>das Original unter einer Übersetzung zeigen</#94A3B8>'
    - '<#5EEAD4>/lingo suggest</#5EEAD4> <dark_gray>-</dark_gray> <#94A3B8>eine bessere Übersetzung vorschlagen</#94A3B8>'
    - '<#94A3B8>Beginne eine Nachricht mit</#94A3B8> <#5EEAD4>!</#5EEAD4><#94A3B8>, damit sie nicht übersetzt wird.</#94A3B8>'
  error:
    players_only: '<#F87171>[X]</#F87171> <#F1F5F9>Das können nur Spieler nutzen.</#F1F5F9>'
    unknown_language: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>ist kein Sprachcode, zum Beispiel de oder en.</#F1F5F9>'
    language_not_enabled: '<#F87171>[X]</#F87171> <#5EEAD4>{value}</#5EEAD4> <#F1F5F9>wird auf diesem Server nicht übersetzt. Nutze auto oder einen der vorgeschlagenen Codes.</#F1F5F9>'
    unknown_incoming: '<#F87171>[X]</#F87171> <#F1F5F9>Nutze</#F1F5F9> <#5EEAD4>auto</#5EEAD4><#F1F5F9>,</#F1F5F9> <#5EEAD4>click</#5EEAD4> <#F1F5F9>oder</#F1F5F9> <#5EEAD4>off</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    unknown_toggle: '<#F87171>[X]</#F87171> <#F1F5F9>Nutze</#F1F5F9> <#5EEAD4>enable</#5EEAD4> <#F1F5F9>oder</#F1F5F9> <#5EEAD4>disable</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    unknown_mode: '<#F87171>[X]</#F87171> <#F1F5F9>Nutze</#F1F5F9> <#5EEAD4>keep</#5EEAD4> <#F1F5F9>oder</#F1F5F9> <#5EEAD4>force</#5EEAD4><#F1F5F9>.</#F1F5F9>'
  settings:
    saved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Deine Übersetzungseinstellungen sind gespeichert.</#F1F5F9>'
    language_set: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Lesesprache:</#F1F5F9> <#5EEAD4>{language}</#5EEAD4> <dark_gray>|</dark_gray> <#94A3B8>du liest jetzt auf {effective}</#94A3B8>'
    write_set: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Schreibsprache:</#F1F5F9> <#5EEAD4>{language}</#5EEAD4> <dark_gray>|</dark_gray> <#94A3B8>deine Nachrichten gelten als {effective}</#94A3B8>'
    incoming:
      automatic: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Nachrichten in anderen Sprachen werden automatisch übersetzt.</#F1F5F9>'
      on_click: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Nachrichten in anderen Sprachen bekommen einen</#F1F5F9> <#5EEAD4>[Ü]</#5EEAD4><#F1F5F9>-Knopf. Klick ihn zum Übersetzen.</#F1F5F9>'
      disabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Du liest jetzt jede Nachricht so, wie sie geschrieben wurde.</#F1F5F9>'
    outgoing:
      enabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Deine Nachrichten werden wieder für andere übersetzt.</#F1F5F9>'
      disabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Deine Nachrichten gehen nicht mehr an den Übersetzer.</#F1F5F9>'
    original:
      enabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Das Original steht jetzt unter jeder Übersetzung.</#F1F5F9>'
      disabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Das Original siehst du nur noch beim Drüberfahren.</#F1F5F9>'
  suggest:
    saved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Danke. Deine Übersetzung wartet auf die Prüfung durch das Team.</#F1F5F9>'
    approved_by_votes: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Danke. Andere Spieler haben dasselbe vorgeschlagen, deshalb gilt es ab jetzt.</#F1F5F9>'
    unknown_message: '<#F87171>[X]</#F87171> <#F1F5F9>Diese Nachricht ist älter als fünf Minuten oder unbekannt.</#F1F5F9>'
    not_translated: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Diese Nachricht wurde für dich nicht übersetzt.</#F1F5F9>'
    unchanged: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Das ist dieselbe Übersetzung wie jetzt.</#F1F5F9>'
    invalid: '<#F87171>[X]</#F87171> <#F1F5F9>Schreib eine Übersetzung mit 1 bis {max} Zeichen.</#F1F5F9>'
    limit: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Du hast in dieser Stunde genug Vorschläge geschickt. Versuch es später wieder.</#F1F5F9>'
    playtime: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Spiel noch etwas länger, bevor du Übersetzungen vorschlägst.</#F1F5F9>'
    blocked: '<#F87171>[X]</#F87171> <#F1F5F9>Das Team hat Vorschläge für dich abgeschaltet.</#F1F5F9>'
    unavailable: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Vorschläge gibt es auf diesem Server nicht.</#F1F5F9>'
    how: '<#5EEAD4>▸</#5EEAD4> <#F1F5F9>Klicke eine übersetzte Chatzeile an und tippe dann deine bessere Übersetzung.</#F1F5F9>'
    missing_text: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Tippe deine Übersetzung hinter die Nachrichten-ID.</#F1F5F9>'
    nothing_recent: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Du hast in den letzten fünf Minuten keine übersetzte Nachricht gesehen.</#F1F5F9>'
  learning:
    unavailable: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Korrekturen und das Übersetzungsgedächtnis gehören zu JExLingo Premium.</#F1F5F9>'
  review:
    approved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Vorschlag</#F1F5F9> <#5EEAD4>#{id}</#5EEAD4> <#F1F5F9>angenommen. Er wird ab jetzt genutzt.</#F1F5F9>'
    rejected: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Vorschlag</#F1F5F9> <#5EEAD4>#{id}</#5EEAD4> <#F1F5F9>abgelehnt.</#F1F5F9>'
    not_pending: '<#F87171>[X]</#F87171> <#F1F5F9>Kein offener Vorschlag mit der ID</#F1F5F9> <#5EEAD4>#{id}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    blocked: '<#4ADE80>[OK]</#4ADE80> <#5EEAD4>{name}</#5EEAD4> <#F1F5F9>kann keine Übersetzungen mehr vorschlagen.</#F1F5F9>'
    unblocked: '<#4ADE80>[OK]</#4ADE80> <#5EEAD4>{name}</#5EEAD4> <#F1F5F9>kann wieder Übersetzungen vorschlagen.</#F1F5F9>'
  glossary:
    add:
      added: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Glossarbegriff</#F1F5F9> <#5EEAD4>{term}</#5EEAD4> <#F1F5F9>hinzugefügt.</#F1F5F9>'
      duplicate: '<#FBBF24>[!]</#FBBF24> <#5EEAD4>{term}</#5EEAD4> <#F1F5F9>steht schon im Glossar.</#F1F5F9>'
      limit_reached: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Das Glossar ist voll. JExLingo Premium hat kein Limit.</#F1F5F9>'
      missing_replacement: '<#F87171>[X]</#F87171> <#F1F5F9>Ein fester Begriff braucht eine Übersetzung, zum Beispiel</#F1F5F9> <#5EEAD4>/lingo glossary add force Insel Island</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    removed: '<#4ADE80>[OK]</#4ADE80> <#5EEAD4>{term}</#5EEAD4> <#F1F5F9>aus dem Glossar entfernt.</#F1F5F9>'
    removed_one: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Glossarbegriff entfernt.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#5EEAD4>{term}</#5EEAD4> <#F1F5F9>steht nicht im Glossar.</#F1F5F9>'
    list:
      header: '<#C4B5FD>Glossar</#C4B5FD> <dark_gray>|</dark_gray> <#F1F5F9>{count}</#F1F5F9> <#94A3B8>Begriffe</#94A3B8>'
      entry: '<dark_gray>-</dark_gray> <#F1F5F9>{term}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{mode}</#94A3B8> <#5EEAD4>{replacement}</#5EEAD4>'
  test:
    result: '<#C4B5FD>{from} » {to}</#C4B5FD> <dark_gray>|</dark_gray> <#94A3B8>{origin}, {millis} ms</#94A3B8><newline><#F1F5F9>{text}</#F1F5F9>'
  export:
    done: '<#4ADE80>[OK]</#4ADE80> <#5EEAD4>{count}</#5EEAD4> <#F1F5F9>angenommene Übersetzungen exportiert nach</#F1F5F9> <#5EEAD4>exports/{file}</#5EEAD4><#F1F5F9>.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Der Export ist fehlgeschlagen. Details stehen im Server-Log.</#F1F5F9>'
  reload:
    done: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Config, Glossarregeln und Übersetzungen neu geladen.</#F1F5F9>'
  status:
    header: '<#C4B5FD>JExLingo-Status</#C4B5FD> <dark_gray>|</dark_gray> <#94A3B8>{edition}</#94A3B8>'
    row: '<#94A3B8>{label}</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>{value}</#F1F5F9>'
    label:
      provider: 'Anbieter'
      reachable: 'Erreichbar'
      breaker: 'Sicherung'
      missing: 'Fehlende Modelle'
      latency: 'Antwortzeit p50 / p95'
      requests: 'Gesendet / fehlgeschlagen / abgewiesen'
      cache: 'Cache-Einträge (Trefferquote)'
      inflight: 'Laufende Übersetzungen'
      slang: 'Chat-Abkürzungen'
      origins: 'Ergebnisse nach Quelle'
      learning: 'Angenommen / feste Phrasen'
    value:
      reachable: 'online'
      unreachable: 'offline'

gui:
  common:
    card:
      line: '<#94A3B8>{text}</#94A3B8>'
      section: '<#C4B5FD>{name}</#C4B5FD>'
      row: '<#94A3B8>{label}</#94A3B8> <dark_gray>|</dark_gray> {value}'
    value:
      plain: '<#F1F5F9>{value}</#F1F5F9>'
      accent: '<#5EEAD4>{value}</#5EEAD4>'
      ok: '<#4ADE80>{value}</#4ADE80>'
      bad: '<#F87171>{value}</#F87171>'
      warn: '<#FBBF24>{value}</#FBBF24>'
      muted: '<#94A3B8>{value}</#94A3B8>'
      loading: '<#94A3B8>Lädt</#94A3B8>'
    back:
      name: '<#F1F5F9>← Zurück</#F1F5F9>'
    close:
      name: '<#F1F5F9>✘ Schließen</#F1F5F9>'
      description: 'Schließt dieses Menü.'
    page:
      previous:
        name: '<#F1F5F9>← Vorherige Seite</#F1F5F9>'
        lore: '<#94A3B8>Seite {page} von {pages}</#94A3B8>'
      next:
        name: '<#F1F5F9>Nächste Seite »</#F1F5F9>'
        lore: '<#94A3B8>Seite {page} von {pages}</#94A3B8>'
    filter:
      option: '<#94A3B8>○</#94A3B8> <#94A3B8>{name}</#94A3B8>'
      option-active: '<#5EEAD4>●</#5EEAD4> <#F1F5F9>{name}</#F1F5F9>'
      action: '<#5EEAD4>▸</#5EEAD4> <#F1F5F9>Linksklick weiter, Rechtsklick zurück</#F1F5F9>'

lingo_settings:
  title: '<gradient:#5EEAD4:#38BDF8>Übersetzung</gradient>'
  header:
    name: '<gradient:#5EEAD4:#38BDF8>Chat-Übersetzung</gradient>'
    description: 'Nachrichten in anderen Sprachen werden für dich übersetzt. Fahre über eine markierte Zeile, um das Original zu sehen.'
    section: 'Deine Einstellungen'
    reading: 'Du liest auf'
    writing: 'Du schreibst auf'
  card:
    section: 'Auswahl'
  option:
    language:
      label: 'Sprache'
      name: '<#F1F5F9>Sprache</#F1F5F9> <dark_gray>|</dark_gray> {value}'
      description: 'Die Sprache, in der du den Chat liest. Auto folgt deiner Spielsprache.'
    write:
      label: 'Schreibsprache'
      name: '<#F1F5F9>Schreibsprache</#F1F5F9> <dark_gray>|</dark_gray> {value}'
      description: 'Die Sprache, in der du schreibst. Auto nimmt deine Lesesprache. Stell sie ein, wenn du in einer anderen Sprache chattest als dein Spiel.'
