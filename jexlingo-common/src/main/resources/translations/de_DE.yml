# JExLingo - Deutsche Übersetzungen
# file-version: 3
#
# Farbsprache (wie im Rest der Suite):
#   Namen #F1F5F9 | Abschnittstitel #C4B5FD | gedämpfter Text #94A3B8 | Akzent #A78BFA
#   OK #4ADE80 | Fehler #F87171 | Warnung #FBBF24 | Titel <gradient:#5EEAD4:#A78BFA>
# Status-Marker im Chat: [OK] erledigt, [!] blockiert oder fehlt, [X] fehlgeschlagen.
# Chat-Panels (Status, Statistik, Inspect, Listen) setzt das Plugin zusammen: Kopf, Kontext, Zeilen, Fußzeile.
# Abschnittstitel in Menüs sind reine Wörter, das Plugin färbt sie. Text nie mit Leerzeichen zentrieren.
# Spielertext (Chatzeilen, Vorschläge, Glossarbegriffe) setzt das Plugin als reinen Text ein, er wird nie geparst.

prefix: '<gradient:#5EEAD4:#A78BFA>Lingo</gradient> <dark_gray>»</dark_gray> '

_defaults:
  title: '<#F1F5F9>Menü</#F1F5F9>'
  back: '<#F1F5F9>Zurück</#F1F5F9>'

jexcommand:
  error:
    no-permission: '<#F87171>[X]</#F87171> <#F1F5F9>Dir fehlt die Berechtigung</#F1F5F9> <#A78BFA>{permission}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    player-only: '<#F87171>[X]</#F87171> <#F1F5F9>Nur Spieler können diesen Befehl nutzen.</#F1F5F9>'
    console-only: '<#F87171>[X]</#F87171> <#F1F5F9>Nur die Konsole kann diesen Befehl nutzen.</#F1F5F9>'
    invalid-argument: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist für</#F1F5F9> <#A78BFA>{name}</#A78BFA> <#F1F5F9>nicht gültig.</#F1F5F9>'
    missing-argument: '<#F87171>[X]</#F87171> <#F1F5F9>Es fehlt</#F1F5F9> <#A78BFA>{name}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    too-many-arguments: '<#F87171>[X]</#F87171> <#F1F5F9>Zu viele Angaben,</#F1F5F9> <#A78BFA>{value}</#A78BFA> <#F1F5F9>war nicht erwartet.</#F1F5F9>'
    invalid-long: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keine ganze Zahl.</#F1F5F9>'
    invalid-double: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keine Zahl.</#F1F5F9>'
    invalid-boolean: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist weder true noch false.</#F1F5F9>'
    not-positive-long: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>muss größer als 0 sein.</#F1F5F9>'
    not-positive-double: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>muss größer als 0 sein.</#F1F5F9>'
    invalid-uuid: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keine gültige UUID.</#F1F5F9>'
    invalid-enum: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keins von</#F1F5F9> <#94A3B8>{options}</#94A3B8><#F1F5F9>.</#F1F5F9>'
    expected-single-word: '<#F87171>[X]</#F87171> <#F1F5F9>Ein Wort erwartet, bekommen:</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    player-not-online: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist nicht online.</#F1F5F9>'
    player-unknown: '<#F87171>[X]</#F87171> <#F1F5F9>Kein Spieler namens</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    internal: '<#F87171>[X]</#F87171> <#F1F5F9>Etwas ist schiefgelaufen:</#F1F5F9> <#94A3B8>{message}</#94A3B8>'
    unknown-subcommand: '<#F87171>[X]</#F87171> <#F1F5F9>Unbekannter Befehl</#F1F5F9> <#A78BFA>{name}</#A78BFA><#F1F5F9>. Versuche /lingo help.</#F1F5F9>'
    ambiguous-subcommand: '<#FBBF24>[!]</#FBBF24> <#A78BFA>{name}</#A78BFA> <#F1F5F9>passt zu mehreren Unterbefehlen:</#F1F5F9> <#A78BFA>{choices}</#A78BFA><#F1F5F9>. Tippe weiter.</#F1F5F9>'
    unknown-type: '<#F87171>[X]</#F87171> <#F1F5F9>Unbekannter Argumenttyp</#F1F5F9> <#A78BFA>{type}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  usage: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Nutze</#F1F5F9> <#A78BFA>{usage}</#A78BFA>'

lingo:
  language:
    de: 'Deutsch'
    en: 'Englisch'
    es: 'Spanisch'
    fr: 'Französisch'
    it: 'Italienisch'
    nl: 'Niederländisch'
    pl: 'Polnisch'
    pt: 'Portugiesisch'
    ru: 'Russisch'
    tr: 'Türkisch'
    cs: 'Tschechisch'
    uk: 'Ukrainisch'
  chat:
    marker: '<dark_gray>[</dark_gray><#94A3B8>{from} » {to}</#94A3B8><dark_gray>]</dark_gray>'
    hover:
      original: '<#C4B5FD>Original</#C4B5FD> <dark_gray>|</dark_gray> <#94A3B8>{from}</#94A3B8><newline><#F1F5F9>{original}</#F1F5F9>'
