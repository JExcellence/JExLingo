      limit_reached: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>The glossary is full. JExLingo Premium has no limit.</#F1F5F9>'
      missing_replacement: '<#F87171>[X]</#F87171> <#F1F5F9>A force term needs a translation, for example</#F1F5F9> <#A78BFA>/lingo glossary add force Insel Island</#A78BFA><#F1F5F9>.</#F1F5F9>'
    removed: '<#4ADE80>[OK]</#4ADE80> <#A78BFA>{term}</#A78BFA> <#F1F5F9>removed from the glossary.</#F1F5F9>'
    removed_one: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Glossary term removed.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#A78BFA>{term}</#A78BFA> <#F1F5F9>is not in the glossary.</#F1F5F9>'
    list:
      header: '<gradient:#5EEAD4:#A78BFA>Glossary</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{count}</#F1F5F9> <#94A3B8>terms</#94A3B8>'
      context: '<#94A3B8>Words the translator keeps or always translates the same way</#94A3B8>'
      entry: '<#F1F5F9>{term}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{mode}</#94A3B8>'
