# JExLingo - English translations
# file-version: 3
#
# Colour language (same as the rest of the suite):
#   names #F1F5F9 | section titles #C4B5FD | muted text #94A3B8 | accent #A78BFA
#   OK #4ADE80 | error #F87171 | warning #FBBF24 | title <gradient:#5EEAD4:#A78BFA>
# Chat status markers: [OK] done, [!] blocked or missing, [X] failed.
# Chat panels (status, stats, inspect, lists) are laid out by the plugin: header, context, rows, footer.
# Menu section titles are plain words; the plugin colours them. Never centre text with spaces here.
# Player text (chat lines, suggestions, glossary terms) is inserted by the plugin as plain text, never parsed.

prefix: '<gradient:#5EEAD4:#A78BFA>Lingo</gradient> <dark_gray>»</dark_gray> '

_defaults:
  title: '<#F1F5F9>Menu</#F1F5F9>'
  back: '<#F1F5F9>Back</#F1F5F9>'

jexcommand:
  error:
    no-permission: '<#F87171>[X]</#F87171> <#F1F5F9>You are missing the permission</#F1F5F9> <#A78BFA>{permission}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    player-only: '<#F87171>[X]</#F87171> <#F1F5F9>Only players can use this command.</#F1F5F9>'
    console-only: '<#F87171>[X]</#F87171> <#F1F5F9>Only the console can use this command.</#F1F5F9>'
    invalid-argument: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not valid for</#F1F5F9> <#A78BFA>{name}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    missing-argument: '<#F87171>[X]</#F87171> <#F1F5F9>Missing</#F1F5F9> <#A78BFA>{name}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    too-many-arguments: '<#F87171>[X]</#F87171> <#F1F5F9>Too many arguments, did not expect</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    invalid-long: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not a whole number.</#F1F5F9>'
    invalid-double: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not a number.</#F1F5F9>'
    invalid-boolean: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not true or false.</#F1F5F9>'
    not-positive-long: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>must be above 0.</#F1F5F9>'
    not-positive-double: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>must be above 0.</#F1F5F9>'
    invalid-uuid: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not a valid UUID.</#F1F5F9>'
    invalid-enum: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not one of</#F1F5F9> <#94A3B8>{options}</#94A3B8><#F1F5F9>.</#F1F5F9>'
    expected-single-word: '<#F87171>[X]</#F87171> <#F1F5F9>Expected one word, got</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    player-not-online: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not online.</#F1F5F9>'
    player-unknown: '<#F87171>[X]</#F87171> <#F1F5F9>No player named</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    internal: '<#F87171>[X]</#F87171> <#F1F5F9>Something went wrong:</#F1F5F9> <#94A3B8>{message}</#94A3B8>'
    unknown-subcommand: '<#F87171>[X]</#F87171> <#F1F5F9>Unknown command</#F1F5F9> <#A78BFA>{name}</#A78BFA><#F1F5F9>. Try /lingo help.</#F1F5F9>'
    ambiguous-subcommand: '<#FBBF24>[!]</#FBBF24> <#A78BFA>{name}</#A78BFA> <#F1F5F9>matches several subcommands:</#F1F5F9> <#A78BFA>{choices}</#A78BFA><#F1F5F9>. Type more letters.</#F1F5F9>'
    unknown-type: '<#F87171>[X]</#F87171> <#F1F5F9>Unknown argument type</#F1F5F9> <#A78BFA>{type}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  usage: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Use</#F1F5F9> <#A78BFA>{usage}</#A78BFA>'

lingo:
  language:
    de: 'German'
    en: 'English'
    es: 'Spanish'
    fr: 'French'
    it: 'Italian'
    nl: 'Dutch'
    pl: 'Polish'
    pt: 'Portuguese'
    ru: 'Russian'
    tr: 'Turkish'
    cs: 'Czech'
    uk: 'Ukrainian'
  chat:
    marker: '<dark_gray>[</dark_gray><#94A3B8>{from} » {to}</#94A3B8><dark_gray>]</dark_gray>'
    hover:
      original: '<#C4B5FD>Original</#C4B5FD> <dark_gray>|</dark_gray> <#94A3B8>{from}</#94A3B8><newline><#F1F5F9>{original}</#F1F5F9>'
      suggest: '<#A78BFA>▸</#A78BFA> <#94A3B8>Click to suggest a better translation</#94A3B8>'
    original_line: '<dark_gray>[</dark_gray><#94A3B8>{from}</#94A3B8><dark_gray>]</dark_gray> <#94A3B8>{original}</#94A3B8>'
    translate_button: '<dark_gray>[</dark_gray><#A78BFA>T</#A78BFA><dark_gray>]</dark_gray>'
    translate_hover: '<#A78BFA>▸</#A78BFA> <#94A3B8>Click to translate this line</#94A3B8>'
    follow_up: '<dark_gray>[</dark_gray><#94A3B8>{from} » {to}</#94A3B8><dark_gray>]</dark_gray> <#94A3B8>{name}</#94A3B8><dark_gray>:</dark_gray> {text}'
  learn:
    hint: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>You seem to write in</#F1F5F9> <#A78BFA>{language}</#A78BFA><#F1F5F9>. Click here to set it, so your messages are translated correctly.</#F1F5F9>'
    hover: '<#A78BFA>▸</#A78BFA> <#94A3B8>Set {language} as your writing language</#94A3B8>'
  show:
    unknown_message: '<#F87171>[X]</#F87171> <#F1F5F9>That message is older than five minutes.</#F1F5F9>'
    same_language: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>That message is already in your language.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>The translator is not available right now. Try again in a moment.</#F1F5F9>'
  erase:
    done: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Deleted the translation settings of</#F1F5F9> <#A78BFA>{name}</#A78BFA> <#F1F5F9>and</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>open suggestions.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Deleting failed. See the server log.</#F1F5F9>'
  onboarding:
    message: '<#F1F5F9>Chat is translated for you into</#F1F5F9> <#A78BFA>{language}</#A78BFA><#F1F5F9>. Hover a marked line to see the original.</#F1F5F9> <#94A3B8>Settings: /lingo</#94A3B8>'
  help:
    banner: '<gradient:#5EEAD4:#A78BFA>Translation commands</gradient> <dark_gray>|</dark_gray> <#94A3B8>Click a line to use it</#94A3B8>'
    entry: '<#A78BFA>▸</#A78BFA> <#F1F5F9>{command}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{description}</#94A3B8>'
    entry-with-args: '<#A78BFA>▸</#A78BFA> <#F1F5F9>{command}</#F1F5F9> <#C4B5FD>{args}</#C4B5FD> <dark_gray>|</dark_gray> <#94A3B8>{description}</#94A3B8>'
    hover-base: '<#F1F5F9>{full}</#F1F5F9><newline><#94A3B8>{description}</#94A3B8>'
    hover-action-run: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Click to run</#F1F5F9>'
    hover-action-suggest: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Click to fill in</#F1F5F9>'
    footer: '<#94A3B8>Start a message with</#94A3B8> <#A78BFA>!</#A78BFA> <#94A3B8>to send it untranslated.</#94A3B8>'
    desc:
      menu: 'Open your translation settings'
      lang: 'Choose the language you read chat in'
      write: 'Choose the language you write in'
      incoming: 'Automatic, on click or off. Without a value: next mode'
      outgoing: 'Translating your messages on or off. Without a value: toggle'
      original: 'Original line under translations on or off. Without a value: toggle'
      suggest: 'Suggest a better translation for a recent line'
  error:
    players_only: '<#F87171>[X]</#F87171> <#F1F5F9>Only players can use this.</#F1F5F9>'
    unknown_language: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is no language code, for example de or en.</#F1F5F9>'
    language_not_enabled: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>is not translated on this server. Use auto or one of the suggested codes.</#F1F5F9>'
    unknown_incoming: '<#F87171>[X]</#F87171> <#F1F5F9>Use</#F1F5F9> <#A78BFA>auto</#A78BFA><#F1F5F9>,</#F1F5F9> <#A78BFA>click</#A78BFA> <#F1F5F9>or</#F1F5F9> <#A78BFA>off</#A78BFA><#F1F5F9>.</#F1F5F9>'
    unknown_period: '<#F87171>[X]</#F87171> <#F1F5F9>Use</#F1F5F9> <#A78BFA>today</#A78BFA><#F1F5F9>,</#F1F5F9> <#A78BFA>week</#A78BFA> <#F1F5F9>or</#F1F5F9> <#A78BFA>month</#A78BFA><#F1F5F9>.</#F1F5F9>'
    unknown_toggle: '<#F87171>[X]</#F87171> <#F1F5F9>Use</#F1F5F9> <#A78BFA>enable</#A78BFA> <#F1F5F9>or</#F1F5F9> <#A78BFA>disable</#A78BFA><#F1F5F9>.</#F1F5F9>'
    unknown_mode: '<#F87171>[X]</#F87171> <#F1F5F9>Use</#F1F5F9> <#A78BFA>keep</#A78BFA> <#F1F5F9>or</#F1F5F9> <#A78BFA>force</#A78BFA><#F1F5F9>.</#F1F5F9>'
  settings:
    saved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Your translation settings are saved.</#F1F5F9>'
    language_set: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Reading language:</#F1F5F9> <#A78BFA>{language}</#A78BFA> <dark_gray>|</dark_gray> <#94A3B8>you now read in {effective}</#94A3B8>'
    write_set: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Writing language:</#F1F5F9> <#A78BFA>{language}</#A78BFA> <dark_gray>|</dark_gray> <#94A3B8>your messages are read as {effective}</#94A3B8>'
    incoming:
      automatic: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Messages in other languages are translated automatically.</#F1F5F9>'
      on_click: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Messages in other languages get a</#F1F5F9> <#A78BFA>[T]</#A78BFA> <#F1F5F9>button. Click it to translate.</#F1F5F9>'
      disabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>You now read every message as written.</#F1F5F9>'
    outgoing:
      enabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Your messages are translated for other players again.</#F1F5F9>'
      disabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Your messages are no longer sent to the translator.</#F1F5F9>'
    original:
      enabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>The original is shown under every translation.</#F1F5F9>'
      disabled: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>The original is only shown on hover.</#F1F5F9>'
  suggest:
    saved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Thanks. Your translation waits for staff review.</#F1F5F9>'
    approved_by_votes: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Thanks. Other players suggested the same, so it is used from now on.</#F1F5F9>'
    unknown_message: '<#F87171>[X]</#F87171> <#F1F5F9>That message is older than five minutes or unknown.</#F1F5F9>'
    not_translated: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>That message was not translated for you.</#F1F5F9>'
    unchanged: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>That is the same as the current translation.</#F1F5F9>'
    invalid: '<#F87171>[X]</#F87171> <#F1F5F9>Write a translation of 1 to {max} characters.</#F1F5F9>'
    limit: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>You sent enough suggestions for this hour. Try again later.</#F1F5F9>'
    playtime: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Play a little longer before suggesting translations.</#F1F5F9>'
    blocked: '<#F87171>[X]</#F87171> <#F1F5F9>Staff turned off suggestions for you.</#F1F5F9>'
    unavailable: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Suggestions are not available on this server.</#F1F5F9>'
    how: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Click a translated chat line, then type your better translation.</#F1F5F9>'
    missing_text: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Type your translation after the message id.</#F1F5F9>'
    nothing_recent: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>You saw no translated message in the last five minutes.</#F1F5F9>'
  phrases:
    header: '<gradient:#5EEAD4:#A78BFA>Pinned phrases</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{count}</#F1F5F9>'
    context: '<#94A3B8>Showing {shown} of {count}, newest first</#94A3B8>'
    entry: '<#A78BFA>#{id}</#A78BFA> <#94A3B8>{pair}</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>{text}</#F1F5F9> <dark_gray>»</dark_gray> <#F1F5F9>{translation}</#F1F5F9>'
    empty: '<#94A3B8>No phrase is pinned yet.</#94A3B8>'
    footer: '<#A78BFA>▸</#A78BFA> <#94A3B8>Unpin one with</#94A3B8> <#F1F5F9>/lingo phrases remove</#F1F5F9> <#94A3B8>and its #id</#94A3B8>'
    removed: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Phrase</#F1F5F9> <#A78BFA>#{id}</#A78BFA> <#F1F5F9>unpinned.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#F1F5F9>No pinned phrase with id</#F1F5F9> <#A78BFA>#{id}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  origin:
    glossary: 'Glossary'
    memory: 'Approved corrections'
    phrase: 'Pinned phrases'
    cache: 'Cache'
    provider: 'Translator'
    fallback: 'Shown untranslated'
    same_language: 'Already in the language'
    skipped: 'Skipped'
  breaker:
    closed: 'normal, calls pass'
    open: 'tripped, calls paused'
    half_open: 'testing one call'
  panel:
    label: '<#94A3B8>{label}</#94A3B8>'
    separator: ' <dark_gray>|</dark_gray> '
    section: '<#C4B5FD>{name}</#C4B5FD>'
    value:
      plain: '<#F1F5F9>{value}</#F1F5F9>'
      accent: '<#A78BFA>{value}</#A78BFA>'
      ok: '<#4ADE80>{value}</#4ADE80>'
      bad: '<#F87171>{value}</#F87171>'
      warn: '<#FBBF24>{value}</#FBBF24>'
      muted: '<#94A3B8>{value}</#94A3B8>'
  ops:
    history_premium: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Statistics of past days are part of JExLingo Premium. Showing today.</#F1F5F9>'
    inspect:
      header: '<gradient:#5EEAD4:#A78BFA>Translation settings</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{name}</#F1F5F9>'
      context_online: '<#94A3B8>Stored choices and what applies right now</#94A3B8>'
      context_offline: '<#94A3B8>Stored choices; the player is offline</#94A3B8>'
      section:
        choices: 'Chosen'
        resolved: 'In use now'
      label:
        reading_choice: 'Reading language'
        writing_choice: 'Writing language'
        client: 'Game language'
        reads: 'Reads in'
        writes: 'Writes in'
        incoming: 'Other languages'
        outgoing: 'Translate own messages'
        original: 'Show original'
        suggestions: 'May suggest'
    set:
      done: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Translation settings of</#F1F5F9> <#A78BFA>{name}</#A78BFA> <#F1F5F9>changed.</#F1F5F9>'
    paused: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Chat translation is paused until</#F1F5F9> <#A78BFA>/lingo resume</#A78BFA><#F1F5F9>.</#F1F5F9>'
    paused_for: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Chat translation is paused for</#F1F5F9> <#A78BFA>{minutes} min</#A78BFA><#F1F5F9>.</#F1F5F9>'
    resumed: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Chat translation is running again.</#F1F5F9>'
    ping:
      done: '<#4ADE80>[OK]</#4ADE80> <#A78BFA>{provider}</#A78BFA> <#F1F5F9>answered in</#F1F5F9> <#A78BFA>{millis} ms</#A78BFA><#F1F5F9>.</#F1F5F9>'
      failed: '<#F87171>[X]</#F87171> <#F1F5F9>The provider did not answer:</#F1F5F9> <#94A3B8>{value}</#94A3B8>'
      one_language: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>A ping needs at least two enabled languages.</#F1F5F9>'
    cache_cleared: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Removed</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>cached translations.</#F1F5F9>'
  learning:
    unavailable: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Corrections and the translation memory are part of JExLingo Premium.</#F1F5F9>'
  review:
    approved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Suggestion</#F1F5F9> <#A78BFA>#{id}</#A78BFA> <#F1F5F9>approved. It is used from now on.</#F1F5F9>'
    rejected: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Suggestion</#F1F5F9> <#A78BFA>#{id}</#A78BFA> <#F1F5F9>rejected.</#F1F5F9>'
    revoked: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Correction</#F1F5F9> <#A78BFA>#{id}</#A78BFA> <#F1F5F9>taken back. The line is translated by the provider again.</#F1F5F9>'
    not_approved: '<#F87171>[X]</#F87171> <#F1F5F9>No approved correction with id</#F1F5F9> <#A78BFA>#{id}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    not_pending: '<#F87171>[X]</#F87171> <#F1F5F9>No open suggestion with id</#F1F5F9> <#A78BFA>#{id}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    blocked: '<#4ADE80>[OK]</#4ADE80> <#A78BFA>{name}</#A78BFA> <#F1F5F9>can no longer suggest translations.</#F1F5F9>'
    unblocked: '<#4ADE80>[OK]</#4ADE80> <#A78BFA>{name}</#A78BFA> <#F1F5F9>can suggest translations again.</#F1F5F9>'
  glossary:
    add:
      added: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Glossary term</#F1F5F9> <#A78BFA>{term}</#A78BFA> <#F1F5F9>added.</#F1F5F9>'
